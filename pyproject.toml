[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "go2-world-model"
version = "0.1.0"
description = "Contract-first scaffold for a Go2 visual world-model controller"
readme = "README.md"
requires-python = ">=3.10.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "HackMIT team" }]
dependencies = [
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
sim = [
  "mujoco==3.3.4",
  "mujoco-menagerie==2026.9.0",
]
ml = [
  "numpy>=1.26,<3",
]
dev = [
  "numpy>=1.26,<3",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
go2wm = "go2wm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/go2wm"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
